name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: margin
          POSTGRES_PASSWORD: margin
          POSTGRES_DB: margin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U margin -d margin"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://margin:margin@localhost:5432/margin
      REDIS_URL: redis://localhost:6379
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Apply migrations
        run: pnpm db:deploy

      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Scan client bundle for secrets
        run: |
          if grep -rlE 'NEXCONN_APP_SECRET|AUTH_SECRET|AUTH_GOOGLE_SECRET|EMAIL_API_KEY|AI_API_KEY|DATABASE_URL|REDIS_URL|postgres(ql)?://|rediss?://' .next/static; then
            echo "::error::Server-only values found in the client bundle"
            exit 1
          fi
          echo "No server-only values in .next/static"
